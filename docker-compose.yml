version: '3.8'

services:
  # 1. MongoDB Database Container
  mongodb:
    image: mongo:latest
    container_name: parkeasy_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - parkeasy-network

  # 2. Node.js Backend Container
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkeasy_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/parkeasy
    depends_on:
      - mongodb
    networks:
      - parkeasy-network

  # 3. React/Vite Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parkeasy_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - parkeasy-network

# Define persistent storage for MongoDB
volumes:
  mongodb_data:

# Define an isolated network for our containers to communicate
networks:
  parkeasy-network:
    driver: bridge
